name: Build and Test

on:
    push:
        branches:
            - "logos/**"
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review

env:
    CARGO_TERM_COLOR: always

jobs:
    clippy_check:
        runs-on: ubuntu-latest
        env:
            RUSTFLAGS: "-Dwarnings" # Make sure CI fails on all warnings, including Clippy lints
        steps:
            - uses: actions/checkout@v5
            - name: Run Clippy
              run: cargo clippy --all-targets --all-features
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Check formatting
              run: cargo fmt --all -- --check
    build-ios:
        # Disabled: Logos doesn't ship mobile.
        if: false
        runs-on: macos-latest
        strategy:
            matrix:
                target:
                    - aarch64-apple-ios
                    - aarch64-apple-ios-sim
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5
            - name: Install Rust target
              run: rustup target add ${{ matrix.target }}
            - name: Build
              run: cargo build --target ${{ matrix.target }}
    build-android:
        # Disabled: Logos doesn't ship mobile.
        if: false
        runs-on: ubuntu-latest
        strategy:
            matrix:
                target:
                    - x86_64-linux-android
                    - aarch64-linux-android
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5
            - name: Install Rust target
              run: rustup target add ${{ matrix.target }}
            - name: Install Android NDK
              run: cargo install cargo-ndk
            - name: Build
              run: cargo ndk -t ${{ matrix.target }} build
    test-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Run tests
              run: cargo test
            - name: Run tests (static rapidsnark)
              run: cargo test --features rust-rapidsnark/static-rapidsnark
    test-linux-arm64:
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v5
            - name: Run tests
              run: cargo test
            - name: Run tests (static rapidsnark)
              run: cargo test --features rust-rapidsnark/static-rapidsnark
    test-macOS:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - name: Run tests
              run: cargo test
            - name: Run tests (static rapidsnark)
              run: cargo test --features rust-rapidsnark/static-rapidsnark
    test-macOS-x86_64:
        runs-on: macos-15-intel
        steps:
            - uses: actions/checkout@v5
            - name: Run tests
              run: cargo test
            - name: Run tests (static rapidsnark)
              run: cargo test --features rust-rapidsnark/static-rapidsnark
    test-windows:
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v5
            - name: Install MinGW
              uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  install: >-
                      mingw-w64-ucrt-x86_64-gcc
                      mingw-w64-ucrt-x86_64-ninja
            # Before the runner's own MinGW, which uses the older C runtime.
            - name: Add MinGW to PATH
              run: echo '${{ runner.temp }}\msys64\ucrt64\bin' >> "$GITHUB_PATH"
            - name: Install Rust target
              run: rustup target add x86_64-pc-windows-gnu
            - name: Run tests
              # rust-witness expects w2c2 at build/w2c2/w2c2, which Visual Studio, cmake's default on Windows, doesn't use.
              env:
                  CMAKE_GENERATOR: Ninja
              run: cargo test --target x86_64-pc-windows-gnu --features rust-rapidsnark/static-rapidsnark
