name: Build and Test

on:
    push:
        branches:
            - "logos/**"
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review

env:
    CARGO_TERM_COLOR: always

jobs:
    clippy_check:
        runs-on: ubuntu-latest
        env:
            RUSTFLAGS: "-Dwarnings" # Make sure CI fails on all warnings, including Clippy lints
        steps:
            - uses: actions/checkout@v5
            - name: Run Clippy
              run: cargo clippy --all-targets --all-features
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Check formatting
              run: cargo fmt --all -- --check
    build-ios:
        # Disabled: Logos doesn't ship mobile.
        if: false
        runs-on: macos-latest
        strategy:
            matrix:
                target:
                    - aarch64-apple-ios
                    - aarch64-apple-ios-sim
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5
            - name: Install Rust target
              run: rustup target add ${{ matrix.target }}
            - name: Build
              run: cargo build --target ${{ matrix.target }}
    build-android:
        # Disabled: Logos doesn't ship mobile.
        if: false
        runs-on: ubuntu-latest
        strategy:
            matrix:
                target:
                    - x86_64-linux-android
                    - aarch64-linux-android
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5
            - name: Install Rust target
              run: rustup target add ${{ matrix.target }}
            - name: Install Android NDK
              run: cargo install cargo-ndk
            - name: Build
              run: cargo ndk -t ${{ matrix.target }} build
    test-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Run tests
              run: cargo test
            - name: Run tests (static rapidsnark)
              run: cargo test --features rust-rapidsnark/static-rapidsnark
    test-linux-arm64:
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v5
            - name: Run tests
              run: cargo test
            - name: Run tests (static rapidsnark)
              run: cargo test --features rust-rapidsnark/static-rapidsnark
    test-macOS:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - name: Run tests
              run: cargo test
            - name: Run tests (static rapidsnark)
              run: cargo test --features rust-rapidsnark/static-rapidsnark
    test-macOS-x86_64:
        runs-on: macos-15-intel
        steps:
            - uses: actions/checkout@v5
            - name: Run tests
              run: cargo test
            - name: Run tests (static rapidsnark)
              run: cargo test --features rust-rapidsnark/static-rapidsnark
